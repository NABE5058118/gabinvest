services:
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    # Keep the webhook private by default. Point BOT_WEBHOOK_BIND at a private
    # interface only when the backend runs on a different host, and restrict
    # port 8080 at the firewall to the backend IP.
    ports:
      - "${BOT_WEBHOOK_BIND:-127.0.0.1}:${BOT_WEBHOOK_PUBLISH_PORT:-8080}:${BOT_WEBHOOK_PORT:-8080}"
    environment:
      BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      WEB_APP_URL: "${WEB_APP_URL}"
      BACKEND_URL: "${BACKEND_URL}"
      ADMIN_TELEGRAM_IDS: "${ADMIN_TELEGRAM_IDS}"
      # Bot -> backend API (narrow scope: bot-sync endpoints only).
      BOT_SYNC_SECRET: "${BOT_SYNC_SECRET:?Set BOT_SYNC_SECRET in .env}"
      BOT_SYNC_SECRET_PREVIOUS: "${BOT_SYNC_SECRET_PREVIOUS:-}"
      # Backend -> bot webhook (separate secret, supports rotation).
      BOT_WEBHOOK_SECRET: "${BOT_WEBHOOK_SECRET:?Set BOT_WEBHOOK_SECRET in .env}"
      BOT_WEBHOOK_SECRET_PREVIOUS: "${BOT_WEBHOOK_SECRET_PREVIOUS:-}"
      BOT_WEBHOOK_ALLOWED_IPS: "${BOT_WEBHOOK_ALLOWED_IPS:-}"
      BOT_WEBHOOK_HOST: "${BOT_WEBHOOK_HOST:-0.0.0.0}"
      BOT_WEBHOOK_PORT: "${BOT_WEBHOOK_PORT:-8080}"
      BOT_WEBHOOK_TLS_CERT: "${BOT_WEBHOOK_TLS_CERT:-}"
      BOT_WEBHOOK_TLS_KEY: "${BOT_WEBHOOK_TLS_KEY:-}"
      BOT_WEBHOOK_CLIENT_CA: "${BOT_WEBHOOK_CLIENT_CA:-}"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Mount certificates read-only when BOT_WEBHOOK_TLS_* points inside the container.
      - "${BOT_WEBHOOK_TLS_DIR:-./bot/certs}:/certs:ro"
