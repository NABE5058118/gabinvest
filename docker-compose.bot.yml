services:
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"          # webhook endpoint for the backend (backend -> bot -> Telegram)
    environment:
      BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      WEB_APP_URL: "${WEB_APP_URL}"
      BACKEND_URL: "${BACKEND_URL}"
      ADMIN_TELEGRAM_IDS: "${ADMIN_TELEGRAM_IDS}"
      BOT_SYNC_SECRET: "${BOT_SYNC_SECRET:?Set BOT_SYNC_SECRET in .env}"
      PYTHONUNBUFFERED: "1"
