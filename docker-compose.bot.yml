services:
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      WEB_APP_URL: "${WEB_APP_URL}"
      BACKEND_URL: "${BACKEND_URL}"
      ADMIN_TELEGRAM_IDS: "${ADMIN_TELEGRAM_IDS}"
      PYTHONUNBUFFERED: "1"
