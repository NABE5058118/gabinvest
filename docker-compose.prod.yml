services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gab_invest
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/gab_invest?schema=public"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      MANAGER_CHAT_ID: "${MANAGER_CHAT_ID}"
      PORT: 3001
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/index.js"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      VITE_API_URL: "${VITE_API_URL}"
      VITE_ADMIN_TOKEN: "${VITE_ADMIN_TOKEN}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend-certbot:/var/www/certbot
      - frontend-ssl:/etc/letsencrypt

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      WEB_APP_URL: "${WEB_APP_URL}"
      PROXY_URL: "socks5://host.docker.internal:10808"
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os; os.path.exists('/proc/1')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot
    volumes:
      - frontend-certbot:/var/www/certbot
      - frontend-ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

volumes:
  postgres-data:
  backend-uploads:
  frontend-certbot:
  frontend-ssl:
