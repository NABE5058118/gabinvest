[project]
name = "gab-invest-bot"
version = "2.0.0"
description = "GAB Invest Telegram Bot — deals, attribution, commissions"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.4,<4",
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"